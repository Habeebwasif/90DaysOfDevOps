services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      REDIS_HOST: cache
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - app_net
    labels:
      com.example.stack: docker-compose-demo
      com.example.service: web

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    labels:
      com.example.stack: docker-compose-demo
      com.example.service: database

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app_net
    labels:
      com.example.stack: docker-compose-demo
      com.example.service: cache

networks:
  app_net:
    name: docker_compose_challenge_net
    driver: bridge

volumes:
  postgres_data:
    name: docker_compose_challenge_postgres_data

